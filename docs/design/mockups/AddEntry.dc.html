<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd166}a:hover{color:#ffe29a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e0e14; color: #e6e6ed; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden">
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 20px; opacity: 0.35">
    <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #ffffff">Anime</h2>
  </div>
  <section aria-label="Add to Anime" style="background: #2a2a3b; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4a4a5e"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #ffffff">Add to Anime</h1>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #a6a6bb">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="t" style="font-size: 13px; font-weight: 600; color: #e6e6ed">Title</label>
      <input id="t" value="frieren" style="height: 52px; border-radius: 12px; border: 2px solid #ffd166; background: #1b1b25; color: #ffffff; font: 500 17px Inter, sans-serif; padding: 0 14px">
      <span style="font-size: 13px; color: #a6a6bb">Typos are fine. The official title, cover, genres and studio fill in for you.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="s" style="font-size: 13px; font-weight: 600; color: #e6e6ed">Studio <span style="font-weight: 400; color: #a6a6bb">(optional)</span></label>
      <input id="s" placeholder="Leave blank to look it up" style="height: 48px; border-radius: 12px; border: 1px solid #2e2e3e; background: #1b1b25; color: #ffffff; font: 400 15px Inter, sans-serif; padding: 0 14px">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="r" style="font-size: 13px; font-weight: 600; color: #e6e6ed">Rating</label>
        <span style="font-size: 22px; font-weight: 700; color: #ffffff">9.5</span>
      </div>
      <input id="r" type="range" min="0" max="10" step="0.1" value="9.5" style="width: 100%; accent-color: #ffd166; height: 28px">
      <span style="font-size: 13px; color: #a6a6bb">Or leave it unrated for now.</span>
    </div>

    <fieldset style="border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; font-weight: 600; color: #e6e6ed; padding: 0; margin-bottom: 8px">Status</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #ffd166; background: #1f3d2c; color: #ffffff; font: 600 14px Inter, sans-serif">Completed</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2e2e3e; background: #1b1b25; color: #e6e6ed; font: 500 14px Inter, sans-serif">Watching</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2e2e3e; background: #1b1b25; color: #e6e6ed; font: 500 14px Inter, sans-serif">Rewatching</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2e2e3e; background: #1b1b25; color: #e6e6ed; font: 500 14px Inter, sans-serif">On Hold</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2e2e3e; background: #1b1b25; color: #e6e6ed; font: 500 14px Inter, sans-serif">Dropped</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2e2e3e; background: #1b1b25; color: #e6e6ed; font: 500 14px Inter, sans-serif">Plan to watch</button>
      </div>
    </fieldset>

    <a href="Picker.dc.html" style="height: 54px; border-radius: 14px; background: #ffd166; color: #13131c; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">Add</a>
  </section>
</div>
</x-dc>

</html>
