<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anime list — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd166}a:hover{color:#ffe29a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1b1b25; color: #e6e6ed; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; background: #1b1b25; border-bottom: 1px solid #2e2e3e">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #ffffff">Anime</h1>
        <span style="font-size: 13px; color: #a6a6bb">48 titles · 44 rated</span>
      </div>
      <button aria-label="Search" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2e2e3e; background: #232339; color: #e6e6ed; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #ffd166; background: #2a2a3b; color: #ffd166; font: 600 13px Inter, sans-serif">Sort: Rating</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2e2e3e; background: #232339; color: #e6e6ed; font: 500 13px Inter, sans-serif">Status: All</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2e2e3e; background: #232339; color: #e6e6ed; font: 500 13px Inter, sans-serif">Genre</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #232339; border: 1px dashed #2e2e3e">
      <div style="width: 52px; height: 78px; border-radius: 8px; background: #2a2a3b; flex-shrink: 0"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-size: 15px; font-weight: 600; color: #ffffff">frieren</span>
        <span style="font-size: 13px; color: #a6a6bb">Looking it up…</span>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #232339">
      <div style="width: 52px; height: 78px; border-radius: 8px; background: #2a2a3b; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #a6a6bb">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 16l5-5 4 4 3-3 4 4"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-size: 15px; font-weight: 600; color: #ffffff">kaiju no 8 s2</span>
        <span style="font-size: 13px; color: #a6a6bb">Couldn't find it</span>
        <div style="display: flex; gap: 8px">
          <button style="height: 32px; padding: 0 12px; border-radius: 8px; border: none; background: #ffd166; color: #13131c; font: 600 13px Inter, sans-serif">Retry</button>
          <button style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #2e2e3e; background: transparent; color: #e6e6ed; font: 500 13px Inter, sans-serif">Paste image link</button>
        </div>
      </div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="EntryDetail.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: #232339; text-decoration: none; color: inherit">
        <div style="width: 52px; height: 78px; border-radius: 8px; background: {{r.tint}}; flex-shrink: 0; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; font-size: 10px; font-weight: 700; color: #ffffff">{{r.init}}</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 15px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
          <span style="font-size: 13px; color: #a6a6bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.studio}} · {{r.genres}}</span>
          <span style="align-self: flex-start; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; background: {{r.statusBg}}; color: #e6e6ed">{{r.status}}</span>
        </div>
        <div style="min-width: 48px; height: 36px; border-radius: 10px; background: {{r.ratingBg}}; color: #ffffff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">{{r.rating}}</div>
      </a>
    </sc-for>
  </main>

  <a href="AddEntry.dc.html" aria-label="Add anime" style="position: absolute; right: 18px; bottom: 96px; height: 56px; padding: 0 22px; border-radius: 28px; background: #ffd166; color: #13131c; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 6px 20px rgba(0,0,0,0.45)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Add
  </a>

  <nav aria-label="Lists" style="height: 76px; background: #13131c; border-top: 1px solid #2e2e3e; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #ffd166; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>Anime</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a6bb; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M7 5v4M12 5v4M17 5v4"></path></svg>Movies</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a6bb; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 21h8M9 3l3 3 3-3"></path></svg>TV</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a6bb; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>Albums</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a6a6bb; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var done = '#1f3d2c', hold = '#4a3f1c';
    var rows = [
      ['Cyberpunk: Edgerunners','TRIGGER','Action, Drama, Sci-Fi','Completed','10.0','#1f6b45','#5b2b4a','CE'],
      ['Fullmetal Alchemist: Brotherhood','bones','Action, Adventure, Fantasy','Completed','10.0','#1f6b45','#5a3b22','FA'],
      ['Naruto: Shippuden','Studio Pierrot','Action, Adventure, Comedy','Completed','9.9','#216b44','#5e4520','NS'],
      ['My Hero Academia','bones','Action, Adventure, Comedy','Completed','9.8','#236a43','#24456b','MH'],
      ['Gurren Lagann','GAINAX','Action, Mecha, Sci-Fi','Completed','9.7','#256a42','#6b2a2a','GL'],
      ['JoJo’s Bizarre Adventure (TV)','david production','Action, Adventure, Supernatural','Completed','9.5','#286941','#3d2a6b','JJ'],
      ['Mob Psycho 100','bones','Action, Comedy, Psychological','On Hold','9.4','#2a6940','#2a5a5a','MP']
    ];
    return { rows: rows.map(function (r) {
      return { title: r[0], studio: r[1], genres: r[2], status: r[3], rating: r[4], ratingBg: r[5], tint: r[6], init: r[7], statusBg: r[3] === 'On Hold' ? hold : done };
    }) };
  }
}
</script>
</body>
</html>
