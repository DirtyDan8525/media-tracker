<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which one did you mean?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd166}a:hover{color:#ffe29a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e0e14; color: #e6e6ed; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <section aria-label="Which one did you mean?" style="height: 780px; box-sizing: border-box; background: #2a2a3b; border-radius: 24px 24px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4a4a5e"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #ffffff">Which one did you mean?</h1>
        <span style="font-size: 14px; color: #a6a6bb">You typed "jojos bizzare"</span>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #a6a6bb">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search again</label>
      <input id="q" value="jojos bizzare" style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid #2e2e3e; background: #1b1b25; color: #ffffff; font: 400 15px Inter, sans-serif; padding: 0 14px">
      <button style="height: 46px; padding: 0 16px; border-radius: 12px; border: none; background: #232339; color: #ffd166; font: 600 14px Inter, sans-serif">Search</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{choices}}" as="c" hint-placeholder-count="4">
        <a href="EntryDetail.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; padding: 8px; border-radius: 14px; background: {{c.cardBg}}; border: 2px solid {{c.border}}">
          <div style="aspect-ratio: 2 / 3; border-radius: 10px; background: {{c.tint}}; display: flex; align-items: flex-start; padding: 8px; box-sizing: border-box">
            <sc-if value="{{c.best}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #ffd166; color: #13131c">Closest match</span>
            </sc-if>
          </div>
          <span style="font-size: 14px; font-weight: 600; color: #ffffff; line-height: 1.3">{{c.title}}</span>
          <span style="font-size: 12px; color: #a6a6bb">{{c.sub}}</span>
        </a>
      </sc-for>
    </div>
    <button style="margin-top: auto; height: 48px; border-radius: 12px; border: 1px solid #2e2e3e; background: transparent; color: #e6e6ed; font: 500 15px Inter, sans-serif">None of these — keep what I typed</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['JoJo’s Bizarre Adventure', 'TV · 2012 · david production', '#3d2a6b', true],
      ['JoJo’s Bizarre Adventure: Stardust Crusaders', 'TV · 2014 · david production', '#2a4a6b', false],
      ['JoJo’s Bizarre Adventure: Diamond is Unbreakable', 'TV · 2016 · david production', '#5a3b22', false],
      ['JoJo’s Bizarre Adventure: Golden Wind', 'TV · 2018 · david production', '#5b2b4a', false]
    ];
    return { choices: list.map(function (c) {
      return { title: c[0], sub: c[1], tint: c[2], best: c[3], border: c[3] ? '#ffd166' : 'transparent', cardBg: '#232339' };
    }) };
  }
}
</script>
</body>
</html>
