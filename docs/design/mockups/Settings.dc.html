<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More and Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd166}a:hover{color:#ffe29a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1b1b25; color: #e6e6ed; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #ffffff">More</h1>
  </header>
  <div style="flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <section aria-labelledby="h-lists" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="h-lists" style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #a6a6bb; text-transform: uppercase; letter-spacing: 0.06em">Other lists</h2>
      <div style="border-radius: 14px; background: #232339; overflow: hidden">
        <a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; padding: 0 14px; color: #e6e6ed; text-decoration: none; border-bottom: 1px solid #2e2e3e"><span style="font-size: 15px">Games</span><span style="font-size: 14px; color: #a6a6bb">27</span></a>
        <a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; padding: 0 14px; color: #e6e6ed; text-decoration: none; border-bottom: 1px solid #2e2e3e"><span style="font-size: 15px">Books</span><span style="font-size: 14px; color: #a6a6bb">14</span></a>
        <a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; padding: 0 14px; color: #a6a6bb; text-decoration: none"><span style="font-size: 15px">Songs</span><span style="font-size: 13px">Hidden</span></a>
      </div>
    </section>

    <section aria-labelledby="h-tabs" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="h-tabs" style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #a6a6bb; text-transform: uppercase; letter-spacing: 0.06em">Tabs</h2>
      <div style="border-radius: 14px; background: #232339; padding: 6px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
          <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="checkbox" checked="{{t.on}}" style="width: 20px; height: 20px; accent-color: #ffd166">{{t.name}}</label>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="h-data" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="h-data" style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #a6a6bb; text-transform: uppercase; letter-spacing: 0.06em">Your data</h2>
      <div style="border-radius: 14px; background: #232339; overflow: hidden">
        <a href="Import.dc.html" style="display: flex; align-items: center; min-height: 50px; padding: 0 14px; color: #e6e6ed; text-decoration: none; border-bottom: 1px solid #2e2e3e; font-size: 15px">Import from Google Sheets</a>
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #2e2e3e">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px">Fill in details</span><button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #2e2e3e; background: transparent; color: #ffd166; font: 600 13px Inter, sans-serif">Pause</button></div>
          <div role="progressbar" aria-label="Fill in details progress" aria-valuenow="86" aria-valuemax="212" style="height: 6px; border-radius: 3px; background: #2e2e3e; overflow: hidden"><div style="width: 41%; height: 6px; background: #ffd166"></div></div>
          <span style="font-size: 13px; color: #a6a6bb">86 of 212 · 3 need you to pick the right match</span>
        </div>
        <button style="width: 100%; text-align: left; min-height: 50px; padding: 0 14px; border: none; background: transparent; color: #e6e6ed; font: 400 15px Inter, sans-serif">Export my data</button>
      </div>
    </section>

    <section aria-labelledby="h-acct" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="h-acct" style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #a6a6bb; text-transform: uppercase; letter-spacing: 0.06em">Account</h2>
      <div style="border-radius: 14px; background: #232339; overflow: hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; padding: 0 14px; border-bottom: 1px solid #2e2e3e"><span style="font-size: 15px">Username</span><span style="font-size: 15px; color: #a6a6bb">@dan</span></div>
        <a href="About.dc.html" style="display: flex; align-items: center; min-height: 50px; padding: 0 14px; color: #e6e6ed; text-decoration: none; font-size: 15px">About Media Tracker</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = ['Anime', 'Movies', 'TV Shows', 'Albums', 'Games', 'Books', 'Anime Seasons', 'TV Seasons'];
    var tabs = on.map(function (n) { return { name: n, on: true }; });
    tabs.push({ name: 'Songs', on: false });
    return { tabs: tabs };
  }
}
</script>
</body>
</html>
