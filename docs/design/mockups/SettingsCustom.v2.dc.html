<style>
.t-midnight{--bg:#1b1b25;--alt:#1f1f2c;--hdr:#13131c;--card:#232339;--panel:#2a2a3b;--text:#e6e6ed;--bright:#ffffff;--muted:#a6a6bb;--grid:#2e2e3e;--hl:#ffd166;--cf-low:#6b2a35;--cf-mid:#6b5a22;--cf-high:#1f6b45;--cf-done:#1f3d2c;--cf-active:#1e3350;--cf-hold:#4a3f1c;--cf-dropped:#4a2026;--hl-ink:var(--hl);--on-hl:var(--hdr);--muted-ink:var(--muted);--shade:var(--hdr);--scheme:dark;}
.t-sakura{--bg:#fff7f9;--alt:#fdeef2;--hdr:#f8dde5;--card:#fff0f4;--panel:#f6e1e8;--text:#3a2730;--bright:#2a1a22;--muted:#8b6a77;--grid:#efd3dc;--hl:#d6457a;--cf-low:#f6c6cf;--cf-mid:#fbe6bf;--cf-high:#cfe8d2;--cf-done:#e2f3e5;--cf-active:#e3ebfa;--cf-hold:#fbf0d6;--cf-dropped:#f9dbe1;--hl-ink:color-mix(in srgb,var(--hl) 70%,var(--bright));--on-hl:var(--bg);--muted-ink:color-mix(in srgb,var(--muted) 75%,var(--bright));--shade:color-mix(in srgb,var(--bright) 40%,transparent);--scheme:light;}

*{box-sizing:border-box}
body{margin:0}
.mt{
  --fill:var(--hl-ink);
  --lift:0 6px 18px color-mix(in srgb,var(--shade) 45%,transparent);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.3,.64,1);
  background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;position:relative;overflow:hidden;
  color-scheme:var(--scheme);
}
:where(.mt) a{color:var(--hl-ink)}
.ph{width:390px;height:844px;display:flex;flex-direction:column}
.pcf{width:1440px;min-height:900px;display:flex}
.d{font-family:Inter,system-ui,sans-serif}
.n{font-family:Inter,system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0;padding:0}
.mt :focus-visible{outline:2px solid var(--hl-ink);outline-offset:2px}
.ttl{margin:0;font:700 26px/1.2 Inter,system-ui,sans-serif;color:var(--bright)}
h2.sec{margin:0 4px;font:600 13px/1.3 Inter,sans-serif;color:var(--muted-ink);text-transform:uppercase;letter-spacing:.06em}
.sub{font-size:13px;color:var(--muted-ink)}
.field{height:50px;border-radius:12px;border:1px solid var(--grid);background:var(--bg);color:var(--bright);font:400 15px Inter,sans-serif;padding:0 14px;width:100%}
.field::placeholder{color:var(--muted-ink);opacity:1}
.ibtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);border:1px solid transparent;background:transparent;flex-shrink:0;text-decoration:none}
.ibtn.box{border-color:var(--grid);background:var(--card)}
.ibtn.on{background:var(--panel);color:var(--hl-ink)}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--grid);background:var(--card);color:var(--text);
  font:500 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;
  transition:transform .15s var(--ease),background .2s}
.btn:hover{background:var(--panel)}
.btn:active{transform:scale(.98)}
.btn.pri{border:none;background:var(--fill);color:var(--on-hl);font-weight:700}
.btn.pri:hover{background:var(--fill)}
.btn.big{min-height:56px;font-size:17px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:10px}
.btn[disabled]{border-style:dashed;background:transparent;color:var(--muted-ink)}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--grid);background:var(--card);color:var(--text);
  font:500 13px Inter,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .2s}
.chip.on{border-color:var(--hl);background:var(--panel);color:var(--hl-ink);font-weight:600}
/* rating badge: background is ratingColor() done with color-mix over the theme's CF set */
.rb{min-width:50px;height:36px;padding:0 9px;border-radius:10px;background:var(--rc);color:var(--bright);
  font:700 16px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.rb.s{min-width:46px;height:32px;font-size:15px;border-radius:10px}
.rb.xs{min-width:40px;height:28px;font-size:14px;border-radius:8px}
.rb.none{background:var(--panel);color:var(--muted-ink);border:1px dashed var(--grid)}
.st{align-self:flex-start;font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;color:var(--text);display:inline-flex;align-items:center}
.st.done{background:var(--cf-done)}.st.hold{background:var(--cf-hold)}.st.active{background:var(--cf-active)}.st.dropped{background:var(--cf-dropped)}
/* covers: plain image, hairline edge */
.cv{position:relative;flex-shrink:0;display:block}
.cv img{position:relative;display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;z-index:1}
.cv ~ *{position:relative;z-index:1}
.cv::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bright) 8%,transparent);pointer-events:none}
/* cover-tinted backdrop: blurred, scaled cover + a role-coloured scrim. Text over it uses Text / Bright text only. */
.bd{position:absolute;overflow:hidden;z-index:0;pointer-events:none}
.bd img{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(38px) saturate(1.2);opacity:.55;transform:scale(1.1)}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 50%,transparent) 0%,color-mix(in srgb,var(--bg) 72%,transparent) 55%,var(--bg) 100%)}
.bd.soft-l{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 95%);mask-image:linear-gradient(90deg,#000 45%,transparent 95%)}
.bd.soft-r{-webkit-mask-image:linear-gradient(270deg,#000 45%,transparent 95%);mask-image:linear-gradient(270deg,#000 45%,transparent 95%)}
.bd.card::after{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 50%,transparent) 0%,color-mix(in srgb,var(--card) 80%,transparent) 60%,var(--card) 100%)}
.z{position:relative;z-index:1}
/* phone bottom bar (v1: Highlight text on the current tab, nothing else) */
.bn{height:76px;flex-shrink:0;background:var(--hdr);border-top:1px solid var(--grid);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:8px;position:relative;z-index:3}
.bn a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-ink);text-decoration:none;font-size:11px;font-weight:500}
.bn a .ic{display:flex;align-items:center;justify-content:center}
.bn a[aria-current]{color:var(--hl-ink);font-weight:600}
/* PC side nav */
.sn{flex:0 0 248px;background:var(--hdr);border-right:1px solid var(--grid);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:2}
.brand{font:800 18px/1 Inter,sans-serif;color:var(--hl-ink);padding:0 10px 18px}
.sn a{min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:10px;color:var(--text);text-decoration:none;font-size:15px;font-weight:500;position:relative;transition:background .2s}
.sn a:hover{background:var(--alt)}
.sn a .c{font-size:13px;color:var(--muted-ink);font-variant-numeric:tabular-nums}
.sn a[aria-current]{background:var(--panel);color:var(--hl-ink);font-weight:700}
.sn .grp{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--grid);padding-top:12px}
.sn .grp a{font-size:14px;font-weight:400;justify-content:flex-start;gap:12px}
.sn .grp a .sp{flex:1}
.sn .grp a svg{color:var(--muted-ink)}
.sn .grp a[aria-current] svg{color:var(--hl-ink)}
.sn .div{height:1px;background:var(--grid);margin:6px 0}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--fill);color:var(--on-hl);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
/* grouped list rows */
.grpbox{border-radius:14px;background:var(--card);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:0 14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--grid);font-size:15px;transition:background .2s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--alt)}
.row .v{font-size:14px;color:var(--muted-ink)}
.tile-ic{width:32px;height:32px;border-radius:9px;background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* count-up numbers: --to is the value x10; the real value sits in .sr for screen readers */
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
@property --ci{syntax:'<integer>';inherits:false;initial-value:0}
@property --cd{syntax:'<integer>';inherits:false;initial-value:0}
.cu{--n:var(--to);--ci:calc(var(--n) / 10 - .5);--cd:calc(var(--n) - var(--ci) * 10);counter-reset:ci var(--ci) cd var(--cd)}
.cu::after{content:counter(ci) "." counter(cd)}
.cn{--n:var(--to);counter-reset:k var(--n)}
.cn::after{content:counter(k)}
@media (prefers-reduced-motion: no-preference){
  .cu,.cn{animation:countup 1.1s cubic-bezier(.15,.75,.25,1) both;animation-delay:var(--cdl,.25s)}
  @keyframes countup{from{--n:var(--from,0)}}
  .rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  .pop{animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 240ms)}
  @keyframes pop{from{opacity:0;transform:scale(.8)}}
  .fade{animation:fade .8s ease both}
  @keyframes fade{from{opacity:0}}
  .bd img{animation:bdin 1.2s var(--ease) both}
  @keyframes bdin{from{opacity:0;transform:scale(1.25)}}
  .growx{animation:growx .9s var(--ease) both;transform-origin:left center;animation-delay:calc(var(--i,0) * 70ms + 200ms)}
  @keyframes growx{from{transform:scaleX(0)}}
  .growy{animation:growy .8s var(--ease) both;transform-origin:center bottom;animation-delay:calc(var(--i,0) * 45ms + 250ms)}
  @keyframes growy{from{transform:scaleY(0)}}
  .shimmer{background:linear-gradient(100deg,var(--panel) 30%,color-mix(in srgb,var(--panel) 80%,var(--bright)) 50%,var(--panel) 70%) 0 0/250% 100%;animation:shim 1.6s linear infinite}
  @keyframes shim{from{background-position:120% 0}to{background-position:-130% 0}}
  .sheet-up{animation:sheet .5s var(--ease) both}
  @keyframes sheet{from{transform:translateY(100%)}}
}


.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw{display:flex;flex-direction:column;border-radius:12px;border:2px solid transparent;overflow:hidden;background:var(--card);cursor:pointer;min-height:74px;position:relative;transition:background .2s}
.sw:hover{background:var(--panel)}
.sw.on{border-color:var(--hl)}
.sw input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.sw .pv{height:44px;padding:7px;display:flex}
.sw .pv>span{flex:1;border-radius:6px;padding:6px;display:flex;flex-direction:column;justify-content:space-between}
.sw .pv i{display:block;border-radius:2px}
.sw .nm{padding:6px 6px 7px;font-size:12px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:4px;white-space:nowrap}
.sw.on .nm{color:var(--hl-ink);font-weight:700}
.selw{position:relative;display:flex;align-items:center}
.selw select{appearance:none;-webkit-appearance:none;width:100%;min-height:44px;padding:0 34px 0 12px;border-radius:12px;border:1px solid var(--grid);background:var(--bg);color:var(--hl-ink);font:600 15px Inter,sans-serif}
.selw svg{position:absolute;right:12px;color:var(--muted-ink);pointer-events:none}
.fld{display:flex;flex-direction:column;gap:6px;padding:10px 14px 12px;border-bottom:1px solid var(--grid)}
@media (prefers-reduced-motion: no-preference){
  .sw{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
}
