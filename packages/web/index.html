<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No pinch zoom (Dan, 2026-11-20): it feels like an app; text size is set in the app instead. --><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b25" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Track and rate the anime, movies, TV, music, games and books you love." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Media Tracker</title>
    <script>
      // Text size is per device: apply it before the first paint (deviceLook.ts has the same table).
      try {
        var s = { smaller: 0.9, larger: 1.12, largest: 1.25 }[localStorage.getItem('mt-text-scale')];
        if (s) document.documentElement.style.setProperty('--app-scale', String(s));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
