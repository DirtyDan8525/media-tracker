name = "media-tracker"
main = "src/index.ts"
compatibility_date = "2026-11-10"

# The Worker handles /api/* only; everything else is served from the built web
# app (packages/web/dist, which exists after `npm run build -w packages/web`).
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "media-tracker"
database_id = "REPLACE_ME_WITH_REAL_D1_DATABASE_ID" # placeholder: filled in during setup (Task 16)
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "dev"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ADMIN_EMAIL = ""
# DEV_EMAIL lives in .dev.vars (gitignored); see .dev.vars.example.
